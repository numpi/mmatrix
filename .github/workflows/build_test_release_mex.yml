name: Build, Test and Release MEX

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Utilizes repository-stored secrets for MATLAB's batch-token licensing
env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  compile-test-package:
    strategy:
      matrix:
        include:  # we skip macos since there is no working fortran compiler there
          - os: ubuntu-latest
            label: linux
          - os: windows-latest
            label: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Install MinGW-w64
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: |
            mingw-w64-x86_64-gcc-fortran
                  
      - name: Set paths for Mingw64
        if: matrix.os == 'windows-latest'
        run: |
          echo "C:\\mingw64\\bin" >> $env:GITHUB_PATH
          echo "MW_MINGW64_LOC=C:\\mingw64" >> $env:GITHUB_ENV

      - name: Setup Matlab
        uses: matlab-actions/setup-matlab@v2
        with:
          cache: true

      - name: Check mex setup
        run: |
          mex -v -setup FORTRAN

      - name: Build MEX and run tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            build_mex
            results = runtests('tests/');
            assertSuccess(results);
      
      - name: Upload MEX files
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: mex-${{ matrix.label }}
          path: |
            **/*.mex*
  
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: compile-test-package
    runs-on: ubuntu-latest
  
    steps:
      - name: Download Linux ZIP
        uses: actions/download-artifact@v4
        with:
          name: mex-linux
          path: .
  
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: mex-windows
          path: .
  
      - name: Zip artifacts
        shell: bash
        run: |
          (cd mex-linux && zip -r ../mex-linux.zip .)
          (cd mex-windows && zip -r ../mex-windows.zip .)
    
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mex-linux.zip
            mex-windows.zip
