name: Build, Test and Release MEX

on:
push:
branches: [ main ]
tags:
- 'v*'
pull_request:
branches: [ main ]

workflow_dispatch:

jobs:
compile-test-package:
strategy:
matrix:
include:
- os: ubuntu-latest
label: linux
- os: macos-latest
label: macos
- os: windows-latest
label: windows

```
runs-on: ${{ matrix.os }}

steps:
  - uses: actions/checkout@v3

  - name: Setup MATLAB
    uses: matlab-actions/setup-matlab@v2
    with:
      cache: true

  - name: Build MEX and run tests
    uses: matlab-actions/run-command@v2
    with:
      command: |
        build_mex
        results = runtests('tests/');
        assertSuccess(results);

  - name: Gather MEX files
    shell: bash
    run: |
      mkdir mex
      find . -name "*.mex*" -exec cp {} mex/ \;

  - name: Create archive
    shell: bash
    run: |
      zip -r mex-${{ matrix.label }}-${{ github.ref_name }}.zip mex

  - name: Upload release asset
    if: startsWith(github.ref, 'refs/tags/')
    run: |
      gh release upload ${{ github.ref_name }} \
        mex-${{ matrix.label }}-${{ github.ref_name }}.zip
    env:
      GH_TOKEN: ${{ github.token }}
